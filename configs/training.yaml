# =============================================================================
# Training Configuration
# =============================================================================

training:

  batch_size: 4

  epochs: 100

  learning_rate: 0.0001

  weight_decay: 0.00001

  optimizer: AdamW

  scheduler: CosineAnnealingLR

  mixed_precision: true

  seed: 42

  num_workers: 8

  pin_memory: true

  checkpoint_interval: 5